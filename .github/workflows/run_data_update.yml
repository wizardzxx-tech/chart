name: Validate data and deploy Pages
on:
  workflow_call:
    secrets:
      COMTRADE_API_KEY:
        required: false
    inputs:
      schedule:
        type: string
        required: true
      apply:
        type: boolean
        default: false
      month_end_only:
        type: boolean
        default: false
      replay_research:
        type: boolean
        default: false
      review_task:
        type: string
      review_sha:
        type: string
      topic:
        type: string
      datasets:
        type: string
      start:
        type: string
      end:
        type: string
permissions: {}
concurrency:
  group: chart-write-and-pages-${{ inputs.apply && 'production' || github.ref }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    outputs:
      ran: ${{ steps.check.outputs.ran }}
      incidents: ${{ steps.check.outputs.incidents }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.apply && 'refs/heads/main' || github.sha }}
          persist-credentials: ${{ inputs.apply }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-updates.txt
      - run: pip install -r requirements-updates.txt
      - name: Validate pipeline
        run: python -m unittest discover -s scripts/validators -p 'test_*.py'
      - name: Ensure filing text extraction is available
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y poppler-utils
          fi
      - name: Install the review OCR engine
        if: inputs.replay_research || inputs.review_task != ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-chi-tra
      - name: Replay approved source files
        if: inputs.replay_research
        run: |
          python scripts/research/legacy_ccc_audit.py
          python scripts/build/replay_research.py
      - name: Run data checks
        id: check
        env:
          SCHEDULE: ${{ inputs.schedule }}
          TOPIC: ${{ inputs.topic }}
          DATASETS: ${{ inputs.datasets }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          APPLY: ${{ inputs.apply }}
          REVIEW_TASK: ${{ inputs.review_task }}
          REVIEW_SHA: ${{ inputs.review_sha }}
          MONTH_END_ONLY: ${{ inputs.month_end_only }}
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: |
          if [[ "$MONTH_END_ONLY" == true ]] && [[ "$(TZ=Asia/Shanghai date +%m)" == "$(TZ=Asia/Shanghai date -d tomorrow +%m)" ]]; then
            echo 'Not a month-end day.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -n "$REVIEW_TASK" && "$APPLY" == true ]]; then
            if [[ ! "$REVIEW_SHA" =~ ^[a-f0-9]{64}$ ]]; then
              echo 'Enter the approved receipt SHA-256.' >&2
              exit 1
            fi
            python scripts/review_data.py "$REVIEW_TASK" --approve-sha256 "$REVIEW_SHA" --report "$RUNNER_TEMP/chart-report.json"
            python scripts/build/run_summary.py "$RUNNER_TEMP/chart-report.json"
            exit 0
          fi
          args=(--schedule "$SCHEDULE" --report "$RUNNER_TEMP/chart-report.json")
          if [[ -n "$DATASETS" ]]; then
            args+=(--dataset "$DATASETS")
          elif [[ -n "$TOPIC" && "$TOPIC" != all ]]; then
            args+=(--topic "$TOPIC")
          fi
          if [[ -n "$START" ]]; then args+=(--start "$START"); fi
          if [[ -n "$END" ]]; then args+=(--end "$END"); fi
          if [[ "$APPLY" != true ]]; then args+=(--dry-run); fi
          if [[ "$SCHEDULE" == daily && -z "$DATASETS" && -z "$TOPIC" ]]; then args+=(--retry-partial); fi
          python scripts/data_update.py "${args[@]}"
          python scripts/build/run_summary.py "$RUNNER_TEMP/chart-report.json"
      - name: Prepare the site artifact
        if: steps.check.outputs.ran == 'true'
        run: python scripts/build/site.py "$RUNNER_TEMP/chart-site"
      - name: Commit validated updates and audit receipts
        if: inputs.apply && steps.check.outputs.ran == 'true'
        run: |
          cp "$RUNNER_TEMP/chart-site/v2/update-center/financial-coverage.json" v2/update-center/
          cp "$RUNNER_TEMP/chart-site/v2/update-center/operating-review.json" v2/update-center/
          git add -- v2 logs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh and audit healthcare data'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ran == 'true'
        with:
          name: data-check-report
          path: ${{ runner.temp }}/chart-report.json
          retention-days: 14
      - name: Record Pages digests and chart anchors
        if: inputs.apply && steps.check.outputs.ran == 'true'
        run: python scripts/build/live_manifest.py "$RUNNER_TEMP/chart-site" "$RUNNER_TEMP/chart-manifest.json"
      - uses: actions/upload-artifact@v4
        if: inputs.apply && steps.check.outputs.ran == 'true'
        with:
          name: pages-verification-manifest
          path: ${{ runner.temp }}/chart-manifest.json
      - uses: actions/upload-pages-artifact@v3
        if: inputs.apply && steps.check.outputs.ran == 'true'
        with:
          path: ${{ runner.temp }}/chart-site
  deploy:
    needs: update
    if: inputs.apply && needs.update.outputs.ran == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Publish verified snapshot
        id: pages
        uses: actions/deploy-pages@v4
        with:
          timeout: 1020000
  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pages-verification-manifest
      - name: Install Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/chart-browser" playwright@1.56.1
          "$RUNNER_TEMP/chart-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify delivered JSON and chart interactions
        env:
          CHART_PLAYWRIGHT: ${{ runner.temp }}/chart-browser/node_modules/playwright/index.mjs
        run: node scripts/build/verify_live.mjs https://wizardzxx-tech.github.io/chart/ chart-manifest.json online-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-verification
          path: online-verification.json
  notify:
    needs: update
    if: inputs.apply && needs.update.outputs.ran == 'true' && needs.update.outputs.incidents != ''
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Consolidate source incidents
        env:
          GH_TOKEN: ${{ github.token }}
          INCIDENTS: ${{ needs.update.outputs.incidents }}
        run: python3 scripts/build/alerts.py
