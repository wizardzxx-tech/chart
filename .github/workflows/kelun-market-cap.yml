name: Kelun market cap and ownership data

on:
  schedule:
    - cron: '30 9 * * 1-5'
    - cron: '15 13 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kelun-market-cap.yml'
      - 'scripts/kelun/**'
      - 'kelun-tracker/config/**'

concurrency:
  group: kelun-market-cap-data
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.KELUN_PAGES_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/kelun/requirements.txt
      - name: Install dependencies and run tests
        run: |
          python -m pip install -r scripts/kelun/requirements.txt
          python -m unittest discover -s scripts/kelun -v
      - name: Probe providers from the runner
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python scripts/kelun/update.py --smoke
      - name: Refresh SSE end-of-day data for Cisen
        continue-on-error: true
        run: python scripts/kelun/update.py --public-cisen
      - name: Refresh the public data
        env:
          KELUN_LICENSED_FEED_URL: ${{ secrets.KELUN_LICENSED_FEED_URL }}
          KELUN_FEED_TOKEN: ${{ secrets.KELUN_FEED_TOKEN }}
        run: |
          python scripts/kelun/update.py --public-reference
          if [[ -n "$KELUN_LICENSED_FEED_URL" ]]; then
            python scripts/kelun/update.py --publish
            printf '%s\n' '{"market_data":true}' > kelun-tracker/data/feed.json
          else
            echo 'A licensed closing-price feed is pending. Updated the reusable ECB reference series.'
          fi
      - name: Commit and refresh the existing Pages site
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_TOKEN: ${{ secrets.KELUN_PAGES_TOKEN }}
        run: |
          git add kelun-tracker/data
          if git diff --cached --quiet; then
            echo 'Published records are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Kelun public data'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          if [[ -z "$PAGES_TOKEN" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
          fi
