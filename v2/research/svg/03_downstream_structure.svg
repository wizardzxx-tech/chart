  <g id="text_1">
   <text style="font-weight: 700; font-size: 22px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #00355f" x="63.36" y="54.282188" transform="rotate(-0 63.36 54.282188)">03  Customer workflows across life science tools</text>
  </g>
  <g id="text_2">
   <text style="font-size: 9.5px; font-family: 'Arial Unicode MS'; text-anchor: middle; fill: #00355f" x="1022.4" y="53.645672" transform="rotate(-0 1022.4 53.645672)">USE MAP</text>
  </g>
  <g id="text_3">
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #00355f" x="63.36" y="93.827813" transform="rotate(-0 63.36 93.827813)">A qualitative workflow map. Customer purchasing shares have not been established.</text>
  </g>
  <g id="text_4">
   <text style="font-size: 10.5px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #00355f" x="63.36" y="596.223352" transform="rotate(-0 63.36 596.223352)">Food, environmental and chemical-analysis uses excluded. Research instruments exclude clinical IVD analyzers.</text>
  </g>
  <g id="text_5">
   <text style="font-size: 8.7px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #00355f" x="63.36" y="620.492062" transform="rotate(-0 63.36 620.492062)">Source: representative supplier product uses; a role map, not an estimated customer revenue mix.</text>
  </g>
  <g id="text_6">
   <text style="font-size: 9.2px; font-family: 'Arial Unicode MS'; text-anchor: end; fill: #00355f" x="1088.64" y="620.568188" transform="rotate(-0 1088.64 620.568188)">2026-10-13</text>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 13px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #ffffff" x="79.488" y="187.389656" transform="rotate(-0 79.488 187.389656)">CUSTOMER</text>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 13px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #ffffff" x="323.712" y="187.389656" transform="rotate(-0 323.712 187.389656)">REAGENTS</text>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 13px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #ffffff" x="574.848" y="187.389656" transform="rotate(-0 574.848 187.389656)">CONSUMABLES</text>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 13px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #ffffff" x="825.984" y="187.389656" transform="rotate(-0 825.984 187.389656)">INSTRUMENTS</text>
  </g>
  <g id="text_11">
   <text style="font-weight: 700; font-size: 12.5px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #00355f" x="79.488" y="244.284516" transform="rotate(-0 79.488 244.284516)">Academia / research hospitals</text>
  </g>
  <g id="text_12">
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(323.712 237.097547)">Targets, enzymes,</text>
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(323.712 251.213203)">cell media</text>
  </g>
  <g id="text_13">
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(574.848 237.162234)">Plates, tips,</text>
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(574.848 251.148516)">cultureware</text>
  </g>
  <g id="text_14">
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(825.984 237.170672)">Sequencing, imaging,</text>
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(825.984 251.286328)">LC-MS</text>
  </g>
  <g id="text_15">
   <text style="font-weight: 700; font-size: 12.5px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #00355f" x="79.488" y="301.384687" transform="rotate(-0 79.488 301.384687)">Biotech / pharma R&amp;D</text>
  </g>
  <g id="text_16">
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(323.712 294.056859)">Proteins, assay panels,</text>
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(323.712 308.172516)">expression reagents</text>
  </g>
  <g id="text_17">
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(574.848 294.186234)">Sensors, columns,</text>
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(574.848 308.172516)">filtration</text>
  </g>
  <g id="text_18">
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(825.984 294.022828)">BLI / SPR, automation,</text>
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(825.984 308.206547)">flow cytometry</text>
  </g>
  <g id="text_19">
   <text style="font-weight: 700; font-size: 12.5px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #00355f" x="79.488" y="358.332516" transform="rotate(-0 79.488 358.332516)">CRO / CDMO</text>
  </g>
  <g id="text_20">
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(323.712 351.080859)">Discovery and</text>
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(323.712 365.196516)">process reagents</text>
  </g>
  <g id="text_21">
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(574.848 351.111516)">Labware, resins,</text>
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(574.848 365.295234)">scale-specific inputs</text>
  </g>
  <g id="text_22">
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(825.984 351.046828)">Assay, process and</text>
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(825.984 365.359922)">QC platforms</text>
  </g>
  <g id="text_23">
   <text style="font-weight: 700; font-size: 12.5px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #00355f" x="79.488" y="415.365305" transform="rotate(-0 79.488 415.365305)">Biomanufacturing</text>
  </g>
  <g id="text_24">
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(323.712 408.070828)">Production media,</text>
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(323.712 422.254547)">feeds and enzymes</text>
  </g>
  <g id="text_25">
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(574.848 408.169547)">Resins, filters,</text>
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(574.848 422.155828)">single-use assemblies</text>
  </g>
  <g id="text_26">
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(825.984 408.169547)">Bioreactors, chromatography,</text>
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(825.984 422.285203)">QC instruments</text>
  </g>
  <g id="text_27">
   <text style="font-weight: 700; font-size: 12.5px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #00355f" x="79.488" y="472.380516" transform="rotate(-0 79.488 472.380516)">IVD development</text>
  </g>
  <g id="text_28">
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(323.712 465.128859)">Antigens, antibodies,</text>
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(323.712 479.244516)">tool enzymes</text>
  </g>
  <g id="text_29">
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(574.848 465.128859)">Assay plates,</text>
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(574.848 479.244516)">magnetic beads</text>
  </g>
  <g id="text_30">
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(825.984 465.258234)">Research and</text>
   <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #00355f" transform="translate(825.984 479.244516)">QC instruments</text>
  </g>
  <g id="text_31">
   <text style="font-weight: 700; font-size: 16px; font-family: 'Arial Unicode MS'; text-anchor: middle; fill: #00355f" x="576" y="544.662" transform="rotate(-0 576 544.662)">An instrument supplier’s total China sales are not its China life-science sales.</text>
  </g>
 </g>
