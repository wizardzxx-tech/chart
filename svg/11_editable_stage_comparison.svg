<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="white"/>
<rect x="72" y="54" width="9" height="85" rx="0" fill="#00355F" stroke="none" stroke-width="1"/>
<text x="105" y="90.64" fill="#00355F" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" text-anchor="start"><tspan x="105" dy="0">AI discovery: workflows, evidence and sensitivities</tspan></text>
<text x="106" y="139.32" fill="#00355F" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start"><tspan x="106" dy="0">Modalities use different units. Workload sensitivities and historical clinical benchmarks are shown separately.</tspan></text>
<line x1="72" y1="176" x2="1848" y2="176" stroke="#A5A5A5" stroke-width="1" />
<rect x="72" y="230" width="435" height="70" fill="#00355F"/>
<text x="94" y="271.75" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="94" dy="0">STAGE</tspan></text>
<rect x="507" y="230" width="310" height="70" fill="#00355F"/>
<text x="662" y="271.75" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="662" dy="0">BEFORE GEN-AI</tspan></text>
<rect x="817" y="230" width="330" height="70" fill="#00355F"/>
<text x="982" y="271.75" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="982" dy="0">AI MECHANISMS</tspan></text>
<rect x="1147" y="230" width="701" height="70" fill="#00355F"/>
<text x="1169" y="271.75" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="1169" dy="0">WHAT CHANGES</tspan></text>
<line x1="72" y1="300" x2="1848" y2="300" stroke="#A5A5A5"/>
<rect x="72" y="300" width="435" height="116" fill="#FFFFFF"/>
<text x="94" y="366.25" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#00355F" text-anchor="start"><tspan x="94" dy="0">Virtual search / design</tspan></text>
<rect x="507" y="300" width="310" height="116" fill="#FFFFFF"/>
<text x="662" y="352" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#00355F" text-anchor="middle"><tspan x="662" dy="0">Large virtual</tspan><tspan x="662" dy="30">libraries</tspan></text>
<rect x="817" y="300" width="330" height="116" fill="#FFFFFF"/>
<text x="982" y="352" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#00355F" text-anchor="middle"><tspan x="982" dy="0">Quality +</tspan><tspan x="982" dy="30">selection</tspan></text>
<rect x="1147" y="300" width="701" height="116" fill="#FFFFFF"/>
<text x="1169" y="352.5" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#00355F" text-anchor="start"><tspan x="1169" dy="0">Large libraries predate generative AI.</tspan><tspan x="1169" dy="27.5">The investment mechanism is better selection and learning.</tspan></text>
<line x1="72" y1="416" x2="1848" y2="416" stroke="#A5A5A5"/>
<rect x="72" y="416" width="435" height="105" fill="#EEF6FC"/>
<text x="94" y="476.75" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#00355F" text-anchor="start"><tspan x="94" dy="0">Physical samples</tspan></text>
<rect x="507" y="416" width="310" height="105" fill="#EEF6FC"/>
<text x="662" y="462.5" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#00355F" text-anchor="middle"><tspan x="662" dy="0">Program-</tspan><tspan x="662" dy="30">specific</tspan></text>
<rect x="817" y="416" width="330" height="105" fill="#EEF6FC"/>
<text x="982" y="462.5" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#00355F" text-anchor="middle"><tspan x="982" dy="0">Modality-</tspan><tspan x="982" dy="30">dependent</tspan></text>
<rect x="1147" y="416" width="701" height="105" fill="#EEF6FC"/>
<text x="1169" y="463" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#00355F" text-anchor="start"><tspan x="1169" dy="0">Small molecules can need fewer syntheses per program.</tspan><tspan x="1169" dy="27.5">Protein libraries and individual profiling are different units.</tspan></text>
<line x1="72" y1="521" x2="1848" y2="521" stroke="#A5A5A5"/>
<rect x="72" y="521" width="435" height="105" fill="#EEF6FC"/>
<text x="94" y="581.75" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#00355F" text-anchor="start"><tspan x="94" dy="0">Assay workload</tspan></text>
<rect x="507" y="521" width="310" height="105" fill="#EEF6FC"/>
<text x="662" y="582.5" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#00355F" text-anchor="middle"><tspan x="662" dy="0">1× baseline</tspan></text>
<rect x="817" y="521" width="330" height="105" fill="#EEF6FC"/>
<text x="982" y="567.5" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#00355F" text-anchor="middle"><tspan x="982" dy="0">1× / 2× /</tspan><tspan x="982" dy="30">5× / 10×</tspan></text>
<rect x="1147" y="521" width="701" height="105" fill="#EEF6FC"/>
<text x="1169" y="568" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#00355F" text-anchor="start"><tspan x="1169" dy="0">Analyst workload sensitivities, not predicted fully profiled</tspan><tspan x="1169" dy="27.5">candidate counts. Include an efficiency/no-growth case.</tspan></text>
<line x1="72" y1="626" x2="1848" y2="626" stroke="#A5A5A5"/>
<rect x="72" y="626" width="435" height="105" fill="#FFFFFF"/>
<text x="94" y="686.75" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#00355F" text-anchor="start"><tspan x="94" dy="0">Clinical development</tspan></text>
<rect x="507" y="626" width="310" height="105" fill="#FFFFFF"/>
<text x="662" y="672.5" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#00355F" text-anchor="middle"><tspan x="662" dy="0">Phase I</tspan><tspan x="662" dy="30">programs</tspan></text>
<rect x="817" y="626" width="330" height="105" fill="#FFFFFF"/>
<text x="982" y="672.5" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#00355F" text-anchor="middle"><tspan x="982" dy="0">Funded clinical</tspan><tspan x="982" dy="30">programs</tspan></text>
<rect x="1147" y="626" width="701" height="105" fill="#FFFFFF"/>
<text x="1169" y="673" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#00355F" text-anchor="start"><tspan x="1169" dy="0">Clinical biology, patients, capital and time remain</tspan><tspan x="1169" dy="27.5">constraints; discovery gains do not establish clinical gains.</tspan></text>
<line x1="72" y1="731" x2="1848" y2="731" stroke="#A5A5A5"/>
<rect x="72" y="731" width="435" height="105" fill="#FFFFFF"/>
<text x="94" y="791.75" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#00355F" text-anchor="start"><tspan x="94" dy="0">Phase I to approval</tspan></text>
<rect x="507" y="731" width="310" height="105" fill="#FFFFFF"/>
<text x="662" y="777.5" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#00355F" text-anchor="middle"><tspan x="662" dy="0">7.9% / 13.8%</tspan><tspan x="662" dy="30">(study estimates)</tspan></text>
<rect x="817" y="731" width="330" height="105" fill="#FFFFFF"/>
<text x="982" y="777.5" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#00355F" text-anchor="middle"><tspan x="982" dy="0">AI advantage</tspan><tspan x="982" dy="30">unproven</tspan></text>
<rect x="1147" y="731" width="701" height="105" fill="#FFFFFF"/>
<text x="1169" y="778" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#00355F" text-anchor="start"><tspan x="1169" dy="0">BIO 2011–2020 and Wong 2000–2015 are different</tspan><tspan x="1169" dy="27.5">cohorts and methods, not an AI comparison.</tspan></text>
<line x1="72" y1="836" x2="1848" y2="836" stroke="#A5A5A5"/>
<rect x="72" y="877" width="1776" height="98" rx="10" fill="#00355F" stroke="none" stroke-width="1"/>
<image x="95" y="899" width="52" height="52" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/>
<text x="171" y="922.52" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="start"><tspan x="171" dy="0">Tool demand depends on funded programs, assay depth, net inputs and prices.</tspan></text>
<text x="72" y="1022.28" fill="#00355F" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start"><tspan x="72" dy="0">Sources: Lyu 2019; Sumitomo 2021; BIO 2011–2020; Wong 2000–2015. Workloads are analyst sensitivities, not empirical cohorts.</tspan></text>
</svg>